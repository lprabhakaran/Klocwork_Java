name: test-snycsca-workflow
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
on:
  workflow_dispatch:
permissions:
  scm-token-own: read
  scm-token-org: read
  id-token: write
jobs:
  build:
    steps:
      - name: checkout-source-code
        uses: cloudbees-io/checkout@v1

      - name: Create Maven Settings
        uses: docker://alpine:latest
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_REPO_URL: ${{ secrets.NEXUS_URL }}
        run: |
          mkdir -p .m2
          cat > .m2/settings.xml << EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>nexus-download</id>
                <username>${NEXUS_USERNAME}</username>
                <password>${NEXUS_PASSWORD}</password>
              </server>
            </servers>
            
            <profiles>
              <profile>
                <id>nexus</id>
                <activation>
                    <activeByDefault>true</activeByDefault>
                </activation>
                <repositories>
                  <repository>
                    <id>nexus-download</id>
                    <name>Internal Releases</name>
                    <url>${NEXUS_REPO_URL}</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
          </settings>
          EOF

          
          # Optional: Copy to home directory as well
          mkdir -p $HOME/.m2
          cp .m2/settings.xml $HOME/.m2/settings.xml
          
          echo "Maven settings created successfully"
          ls -la .m2/
        
      - name: Prepare Maven deps (go-offline)
        uses: docker://maven:3.9.6-eclipse-temurin-17
        env:
          MAVEN_CONFIG: .m2
        run: |
          echo "Running mvn dependency:go-offline..."
          mvn -s .m2/settings.xml dependency:go-offline


      - name: Snyk SCA scan
        uses: cloudbees-io/snyk-sca-scan-dependency@v1
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_REPO_URL: ${{ secrets.NEXUS_URL }}
          MAVEN_CONFIG: .m2        # <-- Makes Maven use your settings.xml
        with:
          orgname: ${{ vars.SNYK_ORG_NAME }}
          token: ${{ secrets.SNYK_SECRET }}
          language: LANGUAGE_JAVA